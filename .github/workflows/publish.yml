name: Publish statskit

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact statskit version to publish from maintenance/0.4'
        required: true
        type: string

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/maintenance/0.4'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Verify the requested package and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          if package["name"] != "statskit" or package["version"] != os.environ["EXPECTED_VERSION"]:
              raise SystemExit("The requested package version differs from Cargo.toml")
          PY

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - name: Verify the package
        run: |
          cargo generate-lockfile
          cargo publish --locked --dry-run --registry crates-io

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish the verified package
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --registry crates-io
